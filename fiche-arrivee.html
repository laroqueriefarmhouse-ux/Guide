<style>
:root{--dg:#1E3A28;--bg:#16231A;--sage:#A9BDA2;--cream:#EDE7DA;--muted:#C9D8C6;--line:rgba(143,176,147,.3);
  --serif:"Cormorant Garamond","EB Garamond",Lora,Georgia,serif;--sans:Jost,"DM Sans",system-ui,sans-serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:var(--dg)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--cream);font-family:var(--serif);font-weight:500;-webkit-font-smoothing:antialiased}
.top{background:var(--dg);height:54px;display:flex;align-items:center;justify-content:flex-end;padding:0 16px;position:relative}
.wave{position:absolute;left:0;bottom:-13px;width:100%;height:14px;display:block;z-index:2}
.lang{display:flex;border:1px solid #8FB093;border-radius:18px;overflow:hidden;font:12px var(--sans)}
.lang button{border:0;background:transparent;color:var(--cream);padding:5px 11px;font:inherit;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--cream);color:var(--bg)}
.hero{background:var(--sage);color:var(--dg);text-align:center;padding:40px 22px 26px}
.hero .lg{width:28.1%;max-width:115px;margin:0 auto;display:block}
.fh{font-size:12.5px;letter-spacing:.3em;padding-left:.3em;margin-top:6px}
.tagl{font-style:italic;font-size:15.5px;margin:4px 0 18px}
.ill{width:52%;max-width:220px;margin:0 auto 12px;display:block}
h1{font-weight:500;font-size:34px;line-height:1.1;margin:6px 0 4px}
.lede{font-style:italic;font-size:18px;margin:0}
main{max-width:600px;margin:0 auto;padding:26px 22px 60px}
.intro{font-size:17px;line-height:1.5;margin:0 0 20px}
fieldset{border:0;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:18px 16px}
label{display:flex;flex-direction:column;gap:4px;font:13px var(--sans);color:var(--muted);letter-spacing:.02em}
label.full{grid-column:1/-1}
label.opt small{font:italic 15px var(--serif);color:#8FB093;letter-spacing:0}
textarea{font:18px var(--serif);font-weight:500;color:var(--cream);background:transparent;border:1px solid rgba(143,176,147,.5);border-radius:4px;padding:8px 10px;width:100%;resize:vertical;margin-top:4px}
textarea:focus{outline:none;border-color:var(--cream)}
input{font:20px var(--serif);font-weight:500;color:var(--cream);background:transparent;border:0;border-bottom:1px solid #8FB093;border-radius:0;padding:6px 0;width:100%}
input:focus{outline:none;border-bottom-color:var(--cream)}
input:focus-visible{outline:2px solid #8FB093;outline-offset:3px}
label.bad{color:#E8A898} label.bad input{border-bottom-color:#E8A898}
.req{color:#8FB093}
.err{font:14px var(--sans);color:#E8A898;margin:16px 0 0;min-height:1em}
.send{display:block;width:100%;margin-top:24px;font:500 16px var(--sans);padding:15px;border-radius:28px;border:1px solid var(--cream);background:var(--cream);color:var(--bg);cursor:pointer}
.send:focus-visible{outline:2px solid #8FB093;outline-offset:3px}
.small{font:14px var(--sans);color:var(--muted);line-height:1.5;margin:14px 0 0;text-align:center}
.small a{color:var(--cream)}
.done{display:none;text-align:center;padding:10px 0}
.done h2{font-weight:500;font-size:26px;margin:0 0 8px}
.done p{font-size:17px;line-height:1.5;margin:0}
.send{display:inline-block!important;width:auto!important;font:500 13.5px var(--sans)!important;letter-spacing:.05em;padding:10px 22px!important;border-radius:22px!important;padding:11px 28px!important}
form{text-align:left}
.btnrow{text-align:center}
</style>
</head>

  <h1 data-t="title"></h1>
  <p class="lede" data-t="lede"></p>
</header>
<main>
  <form id="f" novalidate>
    <p class="intro" data-t="intro"></p>
    <fieldset>
      <label><span><span data-t="last"></span> <span class="req">*</span></span><input name="last" autocomplete="family-name" required></label>
      <label><span><span data-t="first"></span> <span class="req">*</span></span><input name="first" autocomplete="given-name" required></label>
      <label class="full"><span><span data-t="addr"></span> <span class="req">*</span></span><input name="addr" autocomplete="street-address" required></label>
      <label><span><span data-t="zip"></span> <span class="req">*</span></span><input name="zip" autocomplete="postal-code" inputmode="text" required></label>
      <label><span><span data-t="city"></span> <span class="req">*</span></span><input name="city" autocomplete="address-level2" required></label>
      <label class="full"><span><span data-t="email"></span> <span class="req">*</span></span><input name="email" type="email" autocomplete="email" inputmode="email" required></label>
      <label class="full"><span><span data-t="tel"></span> <span class="req">*</span></span><input name="tel" type="tel" autocomplete="tel" inputmode="tel" required></label>
      <label class="full opt"><span data-t="diet"></span><small data-t="dietH"></small><textarea name="diet" rows="3"></textarea></label>
    </fieldset>
    <p class="err" id="err" role="alert"></p>
    <div class="btnrow"><button class="send" type="submit" data-t="send"></button></div>
    <p class="small" data-t="hint"></p>
  </form>
  <div class="done" id="done" role="status">
    <h2 data-t="doneT"></h2>
    <p data-t="doneP"></p>
    <p class="small"><a id="again" href="#" data-t="again"></a></p>
  </div>
</main>
<script>
const MAIL="contact@laroquerie.com";
const T={
 fr:{title:"Fiche d’arrivée",lede:"Pour préparer votre séjour.",
  intro:"Merci de compléter cette fiche avant votre arrivée. Les champs marqués d’un * sont obligatoires.",
  last:"Nom",first:"Prénom",addr:"Adresse",zip:"Code postal",city:"Ville",email:"E-mail",tel:"Téléphone",diet:"Contraintes ou allergies alimentaires",dietH:"Si vous avez réservé la table du chef. Facultatif.",dietL:"Contraintes / allergies",
  send:"Envoyer ma fiche",hint:"Votre messagerie s’ouvre avec la fiche déjà rédigée : il ne reste qu’à appuyer sur Envoyer.",
  errMissing:"Merci de remplir tous les champs.",errEmail:"L’adresse e-mail ne semble pas valide.",errTel:"Le numéro de téléphone ne semble pas valide.",
  doneT:"Merci !",doneP:"Pensez à appuyer sur Envoyer dans votre messagerie. Nous avons hâte de vous accueillir à La Roquerie.",again:"Modifier ma fiche",
  subject:"Fiche d’arrivée",head:"Fiche d’arrivée – La Roquerie Farmhouse"},
 en:{title:"Arrival form",lede:"To prepare for your stay.",
  intro:"Please complete this form before you arrive. Fields marked * are required.",
  last:"Last name",first:"First name",addr:"Address",zip:"Postcode",city:"Town / city",email:"Email",tel:"Phone",diet:"Dietary requirements or allergies",dietH:"If you have booked the chef’s table. Optional.",dietL:"Dietary requirements",
  send:"Send my form",hint:"Your email app opens with the form already written: just tap Send.",
  errMissing:"Please fill in every field.",errEmail:"This email address doesn’t look right.",errTel:"This phone number doesn’t look right.",
  doneT:"Thank you!",doneP:"Remember to tap Send in your email app. We look forward to welcoming you to La Roquerie.",again:"Edit my form",
  subject:"Arrival form",head:"Arrival form – La Roquerie Farmhouse"}
};
let lang="fr";
try{const s=localStorage.getItem("hb-lang"); if(s==="fr"||s==="en") lang=s;}catch(e){}
if(!/^fr/i.test(navigator.language||"fr")){try{if(!localStorage.getItem("hb-lang")) lang="en";}catch(e){lang="en";}}
const P=new URLSearchParams(location.search); if(P.get("lang")==="en"||P.get("lang")==="fr") lang=P.get("lang");
function apply(){
  document.documentElement.lang=lang;
  document.querySelectorAll("[data-t]").forEach(e=>e.textContent=T[lang][e.dataset.t]);
  document.querySelectorAll(".lang button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.l===lang));
  document.title=T[lang].title+" – La Roquerie Farmhouse";
}
document.querySelectorAll(".lang button").forEach(b=>b.onclick=()=>{lang=b.dataset.l;try{localStorage.setItem("hb-lang",lang);}catch(e){}apply();});
const f=document.getElementById("f"),err=document.getElementById("err");
f.addEventListener("input",e=>e.target.closest("label")&&e.target.closest("label").classList.remove("bad"));
f.addEventListener("submit",e=>{
  e.preventDefault(); err.textContent="";
  const v={}; let first=null, msg="";
  [...f.elements].filter(x=>x.name&&x.required).forEach(x=>{
    v[x.name]=x.value.trim(); const bad=!v[x.name];
    x.closest("label").classList.toggle("bad",bad); if(bad&&!first) first=x;
  });
  if(first) msg=T[lang].errMissing;
  else if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v.email)){msg=T[lang].errEmail;first=f.email;f.email.closest("label").classList.add("bad");}
  else if(v.tel.replace(/[^0-9]/g,"").length<8){msg=T[lang].errTel;first=f.tel;f.tel.closest("label").classList.add("bad");}
  if(msg){err.textContent=msg; first.focus(); return;}
  const L=T[lang];
  const body=[L.head,"",
    `${L.last} : ${v.last}`,`${L.first} : ${v.first}`,`${L.addr} : ${v.addr}`,
    `${L.zip} : ${v.zip}`,`${L.city} : ${v.city}`,`${L.email} : ${v.email}`,`${L.tel} : ${v.tel}`].concat(f.diet.value.trim()?["",`${L.dietL} : ${f.diet.value.trim()}`]:[]).join("\n");
  location.href=`mailto:${MAIL}?subject=${encodeURIComponent(L.subject+" – "+v.first+" "+v.last)}&body=${encodeURIComponent(body)}`;
  setTimeout(()=>{f.style.display="none";document.getElementById("done").style.display="block";},600);
});
document.getElementById("again").onclick=e=>{e.preventDefault();document.getElementById("done").style.display="none";f.style.display="block";};
apply();
</script>
</body>
</html>
