<style>
:root{
  --forest:#1E3A28; --forest2:#2D5038; --sage:#7A9B7E; --sage2:#A8BFA9;
  --paper:#16231A; --paper2:#1E3024; --sagebg:#A9BDA2; --cream:#EDE7DA; --muted:#AEB9AA; --lineD:rgba(143,176,147,.3); --ink:#1A1A17;
  --serif:"Cormorant Garamond","EB Garamond",Lora,Georgia,serif;
  --sans:Jost,"DM Sans","Plus Jakarta Sans",system-ui,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  background:var(--forest);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --page:#14231A; } }
:root[data-theme="dark"]{ --page:#14231A; }
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;height:100%;display:flex;flex-direction:column;background:var(--paper);color:var(--forest);font-family:var(--serif);-webkit-font-smoothing:antialiased}
header{flex:none;background:var(--forest);color:var(--paper);padding:10px 16px 0}
.top{display:flex;align-items:center;justify-content:space-between;max-width:600px;margin:0 auto}
.brand{font-family:var(--serif);font-size:21px;font-weight:500;letter-spacing:.06em;line-height:1}
.brand small{display:block;font-family:var(--sans);font-size:10px;letter-spacing:.3em;opacity:.75;margin-top:4px}
.lang{display:flex;border:1px solid var(--sage);border-radius:18px;overflow:hidden;font:12px var(--sans)}
.lang button{border:0;background:transparent;color:var(--paper);padding:5px 11px;font:inherit;cursor:pointer;letter-spacing:.04em}
.lang button[aria-pressed="true"]{background:var(--paper);color:var(--forest)}
nav{display:flex;max-width:600px;margin:10px auto 0}
nav button{flex:1;border:0;background:transparent;color:var(--sage2);font:500 14px var(--sans);letter-spacing:.02em;padding:10px 4px 12px;cursor:pointer;border-bottom:2px solid transparent}
nav button[aria-selected="true"]{color:var(--paper);border-bottom-color:var(--paper)}
nav button:focus-visible,.lang button:focus-visible,a:focus-visible,.copy:focus-visible{outline:2px solid var(--sage2);outline-offset:2px}
main{flex:1;position:relative;min-height:0}
.panel{position:absolute;inset:0;display:none}
.panel.on{display:block}
.panel:focus{outline:none}
iframe{border:0;width:100%;height:100%;display:block;background:var(--paper)}
#infos{overflow:auto;-webkit-overflow-scrolling:touch}
.wrap{max-width:600px;margin:0 auto;padding:26px 22px 40px}
#infos{background:var(--paper)}
.hero{position:relative;text-align:center;background:var(--sagebg);margin:-26px -22px 8px;padding:38px 22px 26px}
.hero img{pointer-events:none}
.hero .logo{width:28.1%;max-width:115px;margin:0 auto;display:block}
.hero .tagl{font-family:var(--serif);font-style:italic;font-weight:500;font-size:15.5px;color:#1E3A28;margin:4px auto 0}
.duo{display:flex;justify-content:center;align-items:flex-end;gap:6%;margin-top:14px}
.duo .veg{width:40%;max-width:190px}
.duo .boots{width:34%;max-width:150px}
.hero .cup{position:absolute;left:-14px;top:30px;width:34%;max-width:180px}
.hero .fruit{position:absolute;right:-12px;top:10px;width:30%;max-width:160px}
.wrap h1{font-weight:500;font-size:34px;margin:10px 0 4px;line-height:1.1;text-align:center}
.lede{font-style:italic;font-size:18px;color:var(--forest);margin:0;text-align:center}
.block{border-top:1px solid var(--sage2);padding:18px 0 6px}
.block h2{font-weight:500;font-size:24px;margin:0 0 10px}
.line{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:7px 0;font-size:19px}
.line span:first-child{color:var(--forest2)}
.line b{font-weight:600;text-align:right}
.copy{font:500 13px var(--sans);color:var(--forest);background:transparent;border:1px solid var(--sage);border-radius:16px;padding:5px 12px;cursor:pointer;margin-left:8px}
.acts{display:grid;gap:10px;margin:6px 0 10px}
.acts a{display:block;text-align:center;text-decoration:none;font:500 15px var(--sans);padding:13px;border-radius:26px;border:1px solid var(--forest);color:var(--forest)}
.acts a.primary{background:var(--forest);color:var(--paper)}
address{font-style:normal;font-size:19px;line-height:1.45;margin-bottom:10px}
.small{font-family:var(--sans);font-size:13px;color:var(--forest2);line-height:1.5}
.todo{background:#F3E3B5;padding:0 4px}
#infos{color:var(--cream)}
.hero{color:#1E3A28}
.hero .lede{color:#2D5038}
.block{border-top-color:var(--lineD)}
.line span:first-child,.small{color:#C9D8C6}
.small{font-size:14.5px}
.copy{color:var(--cream);border-color:#8FB093}
.acts a{color:var(--cream);border-color:rgba(237,231,218,.5)}
.acts a.primary{background:var(--cream);color:#16231A;border-color:var(--cream)}
header{background:#1E3A28;color:var(--cream)}
.wave{position:absolute;top:-1px;left:0;width:100%;height:14px;z-index:3;pointer-events:none;display:block}
nav button{color:#8FB093}
nav button[aria-selected="true"]{color:var(--cream)}
nav button{border-bottom:0!important}
#tabrect{transition:transform .25s ease}
@media (prefers-reduced-motion:reduce){#tabrect{transition:none}}
.lang button{color:var(--cream)}
.lang button[aria-pressed="true"]{background:var(--cream);color:#16231A}
main,.panel,iframe{background:#16231A}
body{font-weight:500}
.hero{margin-bottom:22px}
.hero+.block{border-top:0;padding-top:4px}
.fh{font-family:var(--serif);font-weight:500;font-size:12.5px;letter-spacing:.3em;padding-left:.3em;color:#1E3A28;margin-top:6px}
</style>

  if(force||loaded[p]!==want){ f.src=want; loaded[p]=want; }
}
function show(p){
  if(!["bar","guide","infos"].includes(p)) p="infos";
  document.querySelectorAll(".panel").forEach(x=>x.classList.toggle("on",x.id===p));
  document.querySelectorAll("nav button").forEach(b=>{b.setAttribute("aria-selected",b.dataset.p===p);b.tabIndex=b.dataset.p===p?0:-1;});
  const idx=["infos","bar","guide"].indexOf(p); const r=document.getElementById("tabrect"); if(r) r.style.transform="translateX("+(idx*113.3333)+"px)";
  load(p); if(location.hash!=="#"+p) history.replaceState(null,"","#"+p);
}
function applyLang(){
  document.documentElement.lang=lang;
  document.querySelectorAll("[data-t]").forEach(e=>e.textContent=T[lang][e.dataset.t]);
  document.querySelectorAll(".lang button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.l===lang));
  const cur=(document.querySelector(".panel.on")||{}).id;
  Object.keys(loaded).forEach(p=>{ if(p===cur) load(p); else delete loaded[p]; });
}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>show(b.dataset.p));
document.querySelector("nav").addEventListener("keydown",e=>{
  const bs=[...document.querySelectorAll("nav button")]; const i=bs.findIndex(b=>b.getAttribute("aria-selected")==="true");
  if(e.key==="ArrowRight"||e.key==="ArrowLeft"){ const n=bs[(i+(e.key==="ArrowRight"?1:bs.length-1))%bs.length]; show(n.dataset.p); n.focus(); }
});
document.querySelectorAll(".lang button").forEach(b=>b.onclick=()=>{lang=b.dataset.l;try{localStorage.setItem("hb-lang",lang);}catch(e){}applyLang();});
document.getElementById("copy").onclick=async e=>{
  try{await navigator.clipboard.writeText(document.getElementById("pw").textContent);e.target.textContent=T[lang].copied;setTimeout(()=>e.target.textContent=T[lang].copy,1500);}catch(err){}
};
window.addEventListener("hashchange",()=>show(location.hash.slice(1)));
applyLang(); show(location.hash.slice(1)||"infos");
</script>
</body>
