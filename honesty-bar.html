<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Honesty Bar – La Roquerie Farmhouse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Cormorant+SC:wght@500&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --forest:#1E3A28; --forest2:#2D5038; --sage:#7A9B7E; --sage2:#A8BFA9;
  --paper:#F5F0E6; --paper2:#EDE6D8; --ink:#1A1A17;
  --page:#E9E3D6; --frame:#A8BFA9;
  --serif:"Cormorant Garamond","EB Garamond",Lora,Georgia,serif;
  --sc:"Cormorant SC","Cormorant Garamond",Georgia,serif;
  --sans:Jost,"DM Sans","Plus Jakarta Sans",system-ui,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --page:#14231A; --frame:#2D5038; }
}
:root[data-theme="dark"]{ --page:#14231A; --frame:#2D5038; }
html{scroll-padding-top:env(safe-area-inset-top,0px);}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0}
body{background:var(--page);color:var(--forest);font-family:var(--serif);-webkit-font-smoothing:antialiased;overflow-x:hidden}
img{max-width:100%;display:block}
.card{
  max-width:600px;margin:0 auto;background:var(--paper);
  border-left:6px double var(--frame);border-right:6px double var(--frame);
  min-height:100vh;padding:0 22px 150px;position:relative;
}
@media (min-width:640px){.card{margin:28px auto;border:6px double var(--frame);min-height:auto}}
html.embed .lang,html.embed .logo{display:none}
html.embed header{padding-top:8px}
.lang{position:absolute;top:14px;right:16px;display:flex;border:1px solid var(--sage2);border-radius:20px;overflow:hidden;font-family:var(--sans);font-size:12px;z-index:2}
.lang button{border:0;background:transparent;color:var(--forest);padding:5px 11px;font:inherit;cursor:pointer;letter-spacing:.04em}
.lang button[aria-pressed="true"]{background:var(--forest);color:var(--paper)}
header{position:relative;padding-top:26px;text-align:center}
.art{pointer-events:none}
.cup{display:block;width:70%;max-width:300px;margin:16px auto 0}
.fruit{position:absolute;right:-8px;top:40px;width:30%;max-width:160px}
.logo{width:34%;max-width:150px;margin:0 auto}
h1{font-family:var(--serif);font-weight:500;font-size:clamp(40px,11vw,58px);letter-spacing:.14em;margin:18px 0 6px;line-height:1;padding-left:.14em}
.tag{font-style:italic;font-size:19px;line-height:1.4;margin:6px auto 0;max-width:30ch;color:var(--forest2)}
.orn{display:flex;justify-content:center;align-items:center;gap:8px;color:var(--sage);margin:18px 0}
.orn::before,.orn::after{content:"";height:1px;width:48px;background:var(--sage2)}
.orn span{width:6px;height:6px;border:1px solid var(--sage);transform:rotate(45deg)}
.intro{font-size:18px;line-height:1.5;margin:0 0 12px;color:var(--ink)}
.steps{list-style:none;margin:0;padding:14px 16px;border:1px solid var(--sage2);display:grid;gap:10px;font-size:17px;line-height:1.3}
.steps li{display:flex;gap:12px;align-items:center}
.steps b{flex:none;width:28px;height:28px;border:1px solid var(--forest);border-radius:50%;display:grid;place-items:center;font-weight:500;font-size:15px}
.gouter{margin-top:22px;background:var(--paper2);border:1px solid var(--forest);outline:1px solid var(--sage2);outline-offset:-6px;padding:18px 18px 16px}
.gouter h2{margin:0;font-family:var(--sc);font-weight:500;font-size:24px;letter-spacing:.04em}
.gouter p{margin:4px 0 12px;font-style:italic;font-size:17px;line-height:1.35;color:var(--forest2)}
.row{display:flex;align-items:center;gap:10px;min-height:48px;padding:5px 0}
.row .n{flex:1;font-size:19px;line-height:1.2}
.row .n small{display:block;font-size:14px;font-style:italic;color:var(--sage)}
.row .p{font-family:var(--sans);font-size:14px;min-width:38px;text-align:right;color:var(--forest2)}
.step{display:flex;align-items:center;border:1px solid var(--sage2);border-radius:22px;background:var(--paper)}
.step button{width:38px;height:38px;border:0;background:transparent;color:var(--forest);font:500 20px var(--sans);cursor:pointer;border-radius:50%}
.step button:disabled{color:var(--sage2);cursor:default}
.step output{min-width:22px;text-align:center;font:500 16px var(--sans)}
.step.on{border-color:var(--forest);background:var(--forest)}
.step.on button,.step.on output{color:var(--paper)}
h2.sec{font-family:var(--sc);font-weight:500;font-size:22px;letter-spacing:.05em;margin:26px 0 2px;border-bottom:1px solid var(--sage2);padding-bottom:4px}
.drinks-title{text-align:center;font-family:var(--sc);font-weight:500;font-size:28px;letter-spacing:.12em;margin:34px 0 0}
.note{font-style:italic;font-size:16px;color:var(--forest2);margin:6px 0 4px;line-height:1.4}
.amount{display:flex;align-items:center;gap:6px;border-bottom:1px solid var(--sage);padding:2px 2px}
.amount input{width:70px;border:0;background:transparent;font:500 17px var(--sans);color:var(--forest);text-align:right;padding:6px 0}
.bottle{width:78%;max-width:360px;margin:18px auto 0}
.who{margin-top:10px;display:grid;grid-template-columns:1fr 1fr;gap:14px 16px}
.who label{display:flex;flex-direction:column;gap:2px;font-family:var(--sans);font-size:13px;color:var(--forest2);letter-spacing:.02em}
.who label.full{grid-column:1/-1}
.who input{font:20px var(--serif);color:var(--ink);border:0;border-bottom:1px solid var(--sage);background:transparent;padding:6px 0;border-radius:0;width:100%}
.who input:focus,.amount input:focus{outline:none;border-color:var(--forest)}
button:focus-visible,input:focus-visible{outline:2px solid var(--forest2);outline-offset:2px}
.req{margin-top:18px;border:1px solid var(--sage2);padding:16px 16px 18px}
.req h3{margin:0;font-weight:500;font-size:23px}
.req p{margin:4px 0 10px;font-size:17px;line-height:1.4;color:var(--forest2)}
.req p i{display:block;margin-top:4px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 4px}
.chips button{font:15px var(--sans);color:var(--forest);background:transparent;border:1px solid var(--sage2);border-radius:20px;padding:8px 14px;cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--forest);border-color:var(--forest);color:var(--paper)}
.req input,.req textarea{width:100%;font:18px var(--serif);color:var(--ink);background:transparent;border:0;border-bottom:1px solid var(--sage);padding:8px 0;border-radius:0;resize:vertical}
.req textarea{border:1px solid var(--sage2);padding:8px 10px;min-height:84px}
.req input:focus,.req textarea:focus{outline:none;border-color:var(--forest)}
.req .row{margin-top:4px}
.req .go{margin-top:14px;width:100%;font:500 15px var(--sans);padding:13px;border-radius:26px;background:transparent;color:var(--forest);border:1px solid var(--forest);cursor:pointer}
.gnote{font-family:var(--sans);font-size:13px;color:var(--forest2);margin:2px 0 0}
.foot{text-align:center;font-style:italic;font-size:17px;margin:30px 0 0;color:var(--forest2)}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:5;padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px));
  background:var(--forest);color:var(--paper);display:flex;align-items:center;gap:14px;justify-content:space-between;
  max-width:600px;margin:0 auto;border-top:1px solid var(--forest2)}
.bar .t{font-family:var(--sans);font-size:13px;letter-spacing:.03em;opacity:.8}
.bar .v{font-family:var(--serif);font-size:30px;font-weight:500;line-height:1}
.send{border:1px solid var(--paper);background:var(--paper);color:var(--forest);font:500 15px var(--sans);padding:12px 20px;border-radius:26px;cursor:pointer}
.sheet{position:fixed;inset:0;z-index:10;background:rgba(20,35,26,.45);display:none;align-items:flex-end;justify-content:center}
.sheet.open{display:flex}
.panel{background:var(--paper);width:100%;max-width:600px;padding:22px 22px calc(22px + env(safe-area-inset-bottom,0px));border-top:6px double var(--frame);max-height:88vh;overflow:auto;animation:up .25s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:0}}
@media (prefers-reduced-motion:reduce){.panel{animation:none}}
.panel h3{margin:0 0 6px;font-weight:500;font-size:26px}
.recap{list-style:none;padding:0;margin:10px 0;font-size:18px;border-top:1px solid var(--sage2)}
.recap li{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--sage2)}
.recap li.tot{font-weight:600;font-size:21px;border-bottom:0}
.err{color:#8A3B2E;font-family:var(--sans);font-size:14px;margin:8px 0}
.acts{display:grid;gap:10px;margin-top:14px}
.acts a,.acts button{display:block;text-align:center;text-decoration:none;font:500 16px var(--sans);padding:14px;border-radius:28px;cursor:pointer}
.primary{background:var(--forest);color:var(--paper);border:1px solid var(--forest)}
.ghost{background:transparent;color:var(--forest);border:1px solid var(--sage)}
.small{font-family:var(--sans);font-size:13px;color:var(--forest2);text-align:center;margin:12px 0 0;line-height:1.5}
</style>
</head>

  <section class="req">
    <h3 data-t="gouterT"></h3>
    <p><span data-t="gouterD"></span><i data-t="gouterX"></i></p>
    <div class="row"><span class="n" data-t="guests"></span><span id="st-gouter"></span></div>
    <input id="gouterNote" class="mnote" autocomplete="off">
    <button class="go" type="button" id="go-gouter" data-t="askGouter"></button>
  </section>
  <section class="req">
    <h3 data-t="tableT"></h3>
    <p><span data-t="tableD"></span><i data-t="tableX"></i></p>
    <div class="chips" id="days" role="group">
      <button type="button" data-d="fri" aria-pressed="true" data-t="dFri"></button>
      <button type="button" data-d="tonight" aria-pressed="false" data-t="dTonight"></button>
      <button type="button" data-d="other" aria-pressed="false" data-t="dOther"></button>
    </div>
    <div class="row"><span class="n" data-t="guests"></span><span id="st-table"></span></div>
    <input id="tNote" class="mnote" autocomplete="off">
    <button class="go" type="button" id="goTable" data-t="askTable"></button>
  </section>
  <section class="req">
    <h3 data-t="customT"></h3>
    <p data-t="customD"></p>
    <textarea id="cNote"></textarea>
    <button class="go" type="button" id="goCustom" data-t="askCustom"></button>
  </section>

  <h2 class="sec" data-t="details"></h2>
  <div class="who">
    <label class="full"><span data-t="name"></span><input id="fName" autocomplete="name"></label>
    <label><span data-t="room"></span><input id="fRoom" autocomplete="off"></label>
    <label><span data-t="date"></span><input id="fDate" autocomplete="off"></label>
  </div>
  <p class="foot" data-t="foot"></p>
</main>

<div class="bar" role="region" aria-live="polite">
  <div><div class="t">Total</div><div class="v" id="total">0 €</div></div>
  <button class="send" id="open" type="button" data-t="send"></button>
</div>

<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="rt">
  <div class="panel">
    <h3 id="rt" data-t="recapT"></h3>
    <div id="who2" class="note"></div>
    <ul class="recap" id="recap"></ul>
    <div class="err" id="err" hidden></div>
    <div class="acts" id="acts">
      <a class="primary" id="sms" target="_top" data-t="sms"></a>
      <a class="ghost" id="wa" target="_blank" rel="noopener" data-t="whatsapp"></a>
      <button class="ghost" id="close" type="button" data-t="back"></button>
    </div>
    <p class="small" data-t="hint"></p>
  </div>
</div>

<script>
const PHONE="+33673645128";
const ITEMS=[
 {sec:{fr:"Jus de fruits & eau",en:"Fruit juices & water"},list:[
  ["apple",5,"Jus de pomme artisanal","Artisan apple juice"],
  ["pear",5,"Jus de poire artisanal","Artisan pear juice"],
  ["applecherry",5,"Jus pomme-cerise artisanal","Artisan apple & cherry juice"],
  ["water",4,"Eau plate ou pétillante (75 cl)","Still or sparkling water (75 cl)"]]},
 {sec:{fr:"Thé & café",en:"Tea & coffee"},list:[
  ["tea",5,"Sélection de thés","Selection of teas"],
  ["espresso",3,"Expresso","Espresso"],
  ["lungo",3,"Allongé","Lungo"]]},
 {sec:{fr:"Douceur",en:"Something sweet"},list:[
  ["cake",5,"Part de gâteau du chef","Slice of the chef’s cake","Sans gluten et sans lactose","Gluten-free and dairy-free"]]},
 {sec:{fr:"Bière & cidre",en:"Beer & cider"},list:[
  ["beer",7,"Bière artisanale normande (33 cl)","Normandy craft beer (33 cl)"],
  ["cider",6,"Cidre artisanal normand (33 cl)","Normandy craft cider (33 cl)"]]},
 {sec:{fr:"Cocktail",en:"Cocktail"},list:[
  ["cocktail",15,"Cocktail en libre-service au bar","Self-service cocktail at the bar"]]}
];
const T={
 fr:{tag:"Un bar en libre-service, fondé sur la confiance.",
  intro:"Le bar est à vous, à toute heure. Servez-vous selon vos envies, notez simplement ce que vous avez choisi, puis envoyez-nous votre fiche.",intro2:"Nous ajouterons vos consommations à votre note de fin de séjour.",intro3:"Ici, on fonctionne comme dans une maison de famille : simplement, librement, et en confiance.",s1:"Servez-vous.",s2:"Notez votre nom, votre chambre et vos consommations.",s3:"Envoyez-nous votre fiche.",
  gt:"Le goûter de la Farmhouse",gd:"Gaufres maison, sélection de confitures et pâte à tartiner, un café ou un thé.",
  gp:"25 € par personne",drinks:"Boissons",wines:"Vins & champagnes",
  wtxt:"Notre sélection de vins et champagnes est disponible sur demande.",
  wnote:"Notre carte évolue au fil des découvertes du chef et de ses suggestions d’accords mets et vins.",
  wq:"Bouteilles ou verres",wa:"Montant",wah:"selon le prix indiqué",details:"Vos coordonnées",
  name:"Nom",room:"Chambre",date:"Date",foot:"Merci de votre confiance & bon séjour à La Roquerie.",
  send:"Envoyer ma fiche",recapT:"Votre fiche",sms:"Envoyer par SMS",whatsapp:"Envoyer par WhatsApp",back:"Modifier",
  hint:"Votre application de messages s’ouvre avec la fiche déjà rédigée : il ne reste qu’à appuyer sur Envoyer.",
  errEmpty:"Ajoutez au moins un produit.",errWho:"Indiquez votre nom et votre chambre pour que nous puissions vous l’attribuer.",
  wineLine:"Vins & champagnes",room2:"Chambre",total:"Total",person:"pers.",
  msgHead:"Honesty Bar – La Roquerie",
  gorder:"À réserver la veille.",reqT:"Les moments de la Farmhouse",tableT:"La table du chef",
  picnicT:"Le panier pique-nique",picnicD:"40 € par personne, à partir de deux personnes.",picnicX:"À réserver à l’avance.",askPicnic:"Réserver un panier",
  gouterT:"Le goûter de la Farmhouse",gouterD:"Gaufres maison, sélection de confitures et pâte à tartiner, un café ou un thé. 25 € par personne.",gouterX:"À réserver la veille.",askGouter:"Réserver le goûter",
  mNote:"Précisions : date, heure, allergies…",
  tableD:"Le vendredi soir, menu de saison en quatre temps, 14 couverts.",tableX:"Un autre soir ? Demandez-nous, nous ferons notre possible.",
  dFri:"Vendredi soir",dTonight:"Ce soir",dOther:"Un autre soir",guests:"Nombre de personnes",
  tNote:"Précisions : date, allergies, occasion…",askTable:"Demander une table",
  customT:"Un moment sur mesure",customD:"Pique-nique, gâteau d’anniversaire, bouteille en chambre… Dites-nous, nous revenons vers vous avec une proposition.",
  cNote:"Votre demande",askCustom:"Envoyer ma demande",
  tableHead:"Demande – La table du chef",picnicHead:"Réservation – Panier pique-nique",gouterHead:"Réservation – Goûter de la Farmhouse",customHead:"Demande sur mesure – La Roquerie",reqRecap:"Votre demande",
  errTable:"Indiquez le nombre de personnes.",errCustom:"Décrivez votre demande.",people:"personne(s)",
  hintReq:"Votre application de messages s’ouvre avec la demande déjà rédigée. Nous vous confirmons rapidement."},
 en:{tag:"A self-service bar, built on trust.",
  intro:"The bar is yours, at any time. Help yourself to whatever you fancy, simply note what you have chosen, then send us your sheet.",intro2:"We will add your drinks to your bill at the end of your stay.",intro3:"Here, things work as they do in a family home: simply, freely, and on trust.",s1:"Help yourself.",s2:"Note your name, your room and what you have had.",s3:"Send us your sheet.",
  gt:"The Farmhouse goûter",gd:"Homemade waffles, a selection of jams and spreads, with a coffee or a tea.",
  gp:"25 € per person",drinks:"Drinks",wines:"Wines & champagnes",
  wtxt:"Our selection of wines and champagnes is available on request.",
  wnote:"Our wine list changes regularly to reflect the chef’s latest discoveries and suggested pairings.",
  wq:"Bottles or glasses",wa:"Amount",wah:"as priced",details:"Your details",
  name:"Name",room:"Room",date:"Date",foot:"Thank you for your honesty & enjoy your stay at La Roquerie.",
  send:"Send my sheet",recapT:"Your sheet",sms:"Send by text message",whatsapp:"Send by WhatsApp",back:"Edit",
  hint:"Your messaging app opens with the sheet already written: just tap Send.",
  errEmpty:"Add at least one item.",errWho:"Enter your name and room so we can add this to your stay.",
  wineLine:"Wines & champagnes",room2:"Room",total:"Total",person:"guests",
  msgHead:"Honesty Bar – La Roquerie",
  gorder:"To be booked the day before.",reqT:"Farmhouse moments",tableT:"The chef’s table",
  picnicT:"The picnic basket",picnicD:"40 € per person, for two guests or more.",picnicX:"To be booked in advance.",askPicnic:"Book a basket",
  gouterT:"The Farmhouse goûter",gouterD:"Homemade waffles, a selection of jams and spreads, with a coffee or a tea. 25 € per person.",gouterX:"To be booked the day before.",askGouter:"Book the goûter",
  mNote:"Details: date, time, allergies…",
  tableD:"Friday evenings: a four-course seasonal menu for 14 guests.",tableX:"Another evening? Ask us and we’ll do our best.",
  dFri:"Friday evening",dTonight:"Tonight",dOther:"Another evening",guests:"Number of guests",
  tNote:"Details: date, allergies, occasion…",askTable:"Request a table",
  customT:"A bespoke moment",customD:"A picnic, a birthday cake, a bottle in your room… Tell us and we’ll come back to you with a proposal.",
  cNote:"Your request",askCustom:"Send my request",
  tableHead:"Request – The chef’s table",picnicHead:"Booking – Picnic basket",gouterHead:"Booking – Farmhouse goûter",customHead:"Bespoke request – La Roquerie",reqRecap:"Your request",
  errTable:"Enter the number of guests.",errCustom:"Describe your request.",people:"guest(s)",
  hintReq:"Your messaging app opens with the request already written. We’ll confirm shortly."}
};
let lang="fr"; const q={};
try{const s=localStorage.getItem("hb-lang"); if(s==="en"||s==="fr") lang=s;}catch(e){}
const PRM=new URLSearchParams(location.search);
if(PRM.get("lang")==="en"||PRM.get("lang")==="fr") lang=PRM.get("lang");
if(PRM.get("embed")==="1") document.documentElement.classList.add("embed");
const fmt=n=>(Math.round(n*100)/100).toString().replace(".",",")+" €";
function stepper(id,host,min=0){
  q[id]=min;
  const w=document.createElement("span"); w.className="step";
  w.innerHTML='<button type="button" aria-label="−">−</button><output>0</output><button type="button" aria-label="+">+</button>';
  const [m,o,p]=[w.children[0],w.children[1],w.children[2]];
  const upd=()=>{o.textContent=q[id];m.disabled=q[id]<=min;w.classList.toggle("on",q[id]>0);calc();};
  m.onclick=()=>{if(q[id]>min){q[id]--;upd();}}; p.onclick=()=>{if(q[id]<99){q[id]++;upd();}};
  host.appendChild(w); upd();
}
function buildMenu(){
  const m=document.getElementById("menu"); m.innerHTML="";
  ITEMS.forEach(g=>{
    const h=document.createElement("h2"); h.className="sec"; h.dataset.sec=JSON.stringify(g.sec); m.appendChild(h);
    g.list.forEach(([id,p,fr,en,sfr,sen])=>{
      const r=document.createElement("div"); r.className="row";
      r.innerHTML=`<span class="n"><span data-fr="${fr}" data-en="${en}"></span>${sfr?`<small data-fr="${sfr}" data-en="${sen}"></small>`:""}</span><span class="p">${p} €</span><span></span>`;
      m.appendChild(r); stepper(id,r.lastElementChild);
    });
  });
}
function applyLang(){
  document.documentElement.lang=lang; document.getElementById("wineAmt").setAttribute("aria-label",T[lang].wa+" (€)");
  document.querySelectorAll("[data-t]").forEach(e=>e.textContent=T[lang][e.dataset.t]);
  tNote.placeholder=T[lang].tNote; ["picnic","gouter"].forEach(k=>{const e=document.getElementById(k+"Note");e.placeholder=T[lang].mNote;e.setAttribute("aria-label",T[lang].mNote);}); cNote.placeholder=T[lang].cNote; cNote.setAttribute("aria-label",T[lang].cNote); tNote.setAttribute("aria-label",T[lang].tNote);
  document.querySelectorAll("[data-fr]").forEach(e=>e.textContent=e.dataset[lang]);
  document.querySelectorAll("[data-sec]").forEach(e=>e.textContent=JSON.parse(e.dataset.sec)[lang]);
  document.querySelectorAll(".lang button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.l===lang));
  document.querySelectorAll(".step").forEach(s=>{s.children[0].setAttribute("aria-label",lang==="fr"?"Retirer":"Remove");s.children[2].setAttribute("aria-label",lang==="fr"?"Ajouter":"Add");});
}
function lines(){
  const out=[];
  ITEMS.forEach(g=>g.list.forEach(([id,p,fr,en])=>{ if(q[id]) out.push([`${q[id]} × ${lang==="fr"?fr:en}`,q[id]*p]); }));
  const amt=parseFloat((document.getElementById("wineAmt").value||"").replace(",","."));
  if(q.wine||amt>0) out.push([`${q.wine?q.wine+" × ":""}${T[lang].wineLine}`, isNaN(amt)?0:amt]);
  return out;
}
function calc(){ const t=lines().reduce((a,l)=>a+l[1],0); document.getElementById("total").textContent=fmt(t); return t; }
function showSheet(title,whoTxt,recapHtml,err,body,hint){
  document.getElementById("rt").textContent=title;
  document.getElementById("who2").textContent=whoTxt;
  document.getElementById("recap").innerHTML=recapHtml;
  const e=document.getElementById("err"); e.hidden=!err; e.textContent=err||"";
  ["sms","wa"].forEach(id=>document.getElementById(id).style.display=err?"none":"block");
  document.querySelector(".small").textContent=hint;
  if(!err){ const x=encodeURIComponent(body);
    document.getElementById("sms").href=`sms:${PHONE}?&body=${x}`;
    document.getElementById("wa").href=`https://wa.me/${PHONE.replace("+","")}?text=${x}`; }
  sheet.classList.add("open"); document.getElementById("close").focus();
}
function who(){ const name=fName.value.trim(),room=fRoom.value.trim(),date=fDate.value.trim();
  if(name&&room){try{localStorage.setItem("hb-who",JSON.stringify({name,room}));}catch(e){}}
  return {name,room,date,line:[name,room&&`${T[lang].room2} ${room}`,date].filter(Boolean).join(" – "),ok:!!(name&&room)}; }
function openSheet(){
  const L=lines(), t=calc(), w=who();
  const recap=L.map(l=>`<li><span>${l[0]}</span><span>${fmt(l[1])}</span></li>`).join("")+`<li class="tot"><span>${T[lang].total}</span><span>${fmt(t)}</span></li>`;
  const err=!L.length?T[lang].errEmpty:(!w.ok?T[lang].errWho:"");
  const body=[T[lang].msgHead,w.line,"",...L.map(l=>`${l[0]} : ${fmt(l[1])}`),"",`${T[lang].total} : ${fmt(t)}`].join("\n");
  showSheet(T[lang].recapT,w.line,recap,err,body,T[lang].hint);
}
const esc=v=>v.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let day="fri";
function askTable(){
  const w=who(), n=q.table, note=tNote.value.trim();
  const dayTxt=T[lang][{fri:"dFri",tonight:"dTonight",other:"dOther"}[day]];
  const items=[dayTxt,n?`${n} ${T[lang].people}`:"",note].filter(Boolean);
  const err=!n?T[lang].errTable:(!w.ok?T[lang].errWho:"");
  showSheet(T[lang].tableT,w.line,items.map(i=>`<li><span>${esc(i)}</span></li>`).join(""),err,[T[lang].tableHead,w.line,"",...items].join("\n"),T[lang].hintReq);
}
function askMoment(k,price){
  const w=who(), n=q[k], note=document.getElementById(k+"Note").value.trim();
  const items=[`${n} ${T[lang].people} – ${fmt(n*price)}`,note].filter(Boolean);
  const err=!w.ok?T[lang].errWho:"";
  showSheet(T[lang][k+"T"],w.line,items.map(i=>`<li><span>${esc(i)}</span></li>`).join(""),err,[T[lang][k+"Head"],w.line,"",...items].join("\n"),T[lang].hintReq);
}
function askCustom(){
  const w=who(), note=cNote.value.trim();
  const err=!note?T[lang].errCustom:(!w.ok?T[lang].errWho:"");
  showSheet(T[lang].customT,w.line,note?`<li><span>${esc(note)}</span></li>`:"",err,[T[lang].customHead,w.line,"",note].join("\n"),T[lang].hintReq);
}
const fName=document.getElementById("fName"),fRoom=document.getElementById("fRoom"),fDate=document.getElementById("fDate"),sheet=document.getElementById("sheet");
buildMenu(); stepper("wine",document.getElementById("st-wine"));
const tNote=document.getElementById("tNote"),cNote=document.getElementById("cNote");
stepper("table",document.getElementById("st-table"));
stepper("picnic",document.getElementById("st-picnic"),2); stepper("gouter",document.getElementById("st-gouter"),1);
document.getElementById("go-picnic").onclick=()=>askMoment("picnic",40); document.getElementById("go-gouter").onclick=()=>askMoment("gouter",25);
document.querySelectorAll("#days button").forEach(b=>b.onclick=()=>{day=b.dataset.d;document.querySelectorAll("#days button").forEach(x=>x.setAttribute("aria-pressed",x===b));});
document.getElementById("goTable").onclick=askTable; document.getElementById("goCustom").onclick=askCustom;
document.getElementById("wineAmt").addEventListener("input",e=>{e.target.value=e.target.value.replace(/[^0-9.,]/g,"");calc();});
const d=new Date(); fDate.value=String(d.getDate()).padStart(2,"0")+"/"+String(d.getMonth()+1).padStart(2,"0")+"/"+d.getFullYear();
try{const w=JSON.parse(localStorage.getItem("hb-who")||"null"); if(w){fName.value=w.name||"";fRoom.value=w.room||"";}}catch(e){}
document.querySelectorAll(".lang button").forEach(b=>b.onclick=()=>{lang=b.dataset.l;try{localStorage.setItem("hb-lang",lang);}catch(e){}applyLang();calc();});
document.getElementById("open").onclick=openSheet;
document.getElementById("close").onclick=()=>sheet.classList.remove("open");
sheet.addEventListener("click",e=>{if(e.target===sheet)sheet.classList.remove("open");});
document.addEventListener("keydown",e=>{if(e.key==="Escape")sheet.classList.remove("open");});
applyLang(); calc();
</script>
</body>
</html>
